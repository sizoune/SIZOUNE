name: Update README Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate stats cards
        run: |
          STATS_URL="https://github-readme-stats-ruby-mu-86.vercel.app/api"
          USER="sizoune"

          curl -sL "${STATS_URL}?username=${USER}&theme=github_dark&hide_border=true&include_all_commits=true&count_private=true&show_icons=true" -o github-stats.svg
          # Top-langs: blend size (0.7) + repo count (0.3) so verbose old Java repos don't dominate,
          # and exclude legacy 2016-2018 Android coursework repos that skew the picture.
          EXCLUDE="TelkomTanjung,Makassar,BukaAmal,Sundawenang,FinalProjectIAKWildan,ClassSharing2,WIMSv2,WIMS,BelajarImageSlider,IdevMiniGame,GiziAnak,AndroidClassSharing1,Rute,TesDycode,WeatherApp,WebViewApp,TubesKita,ChatUsingFirebase,BelajarDesain,FriendlyChat"
          curl -sL "${STATS_URL}/top-langs/?username=${USER}&theme=github_dark&hide_border=true&layout=compact&count_private=true&size_weight=0.7&count_weight=0.3&exclude_repo=${EXCLUDE}" -o top-langs.svg
          curl -sL "https://streak-stats.demolab.com?user=${USER}&theme=github_dark&hide_border=true" -o streak-stats.svg

          # Validate SVGs — reject API-error placeholders so we keep the previous good copy
          for f in github-stats.svg top-langs.svg streak-stats.svg; do
            if ! grep -q "<svg" "$f"; then
              echo "Error: $f is not a valid SVG"
              exit 1
            fi
            if grep -qiE "(Failed to retrieve|Could not fetch|GitHub API issue|Something went wrong|No contributions found)" "$f"; then
              echo "Error: $f contains an upstream API-error placeholder; aborting to keep previous good copy"
              exit 1
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg streak-stats.svg
          # Only commit if there are staged changes (new or modified files)
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "stats: update README stats cards [skip ci]"
          git push
