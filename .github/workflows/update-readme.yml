name: Update README Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate stats cards
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          STATS_URL="https://github-readme-stats.vercel.app/api"
          USER="sizoune"
          T="${GH_STATS_TOKEN}"

          curl -sL "${STATS_URL}?username=${USER}&theme=github_dark&hide_border=true&include_all_commits=true&count_private=true&show_icons=true&token=${T}" -o github-stats.svg
          curl -sL "${STATS_URL}/top-langs/?username=${USER}&theme=github_dark&hide_border=true&layout=compact&count_private=true&token=${T}" -o top-langs.svg
          curl -sL "https://streak-stats.demolab.com?user=${USER}&theme=github_dark&hide_border=true" -o streak-stats.svg

          # Validate SVGs
          for f in github-stats.svg top-langs.svg streak-stats.svg; do
            if ! grep -q "<svg" "$f"; then
              echo "Error: $f is not a valid SVG"
              exit 1
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg streak-stats.svg
          # Only commit if there are staged changes (new or modified files)
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "stats: update README stats cards [skip ci]"
          git push
